# /etc/samba/smb.conf.d/ — share definitions, included from
# /etc/samba/smb.conf (the `include = /etc/samba/smb.conf.d/*.conf` line at the
# end of its [global] section).
#
# This file is COMMENT-ONLY on purpose, and it is deliberately NOT the file
# Shani Cassini writes to.
#
# Two reasons, and the second is the one that bites:
#
#   1. It is what makes the directory exist. shani-cassini-save refuses to
#      create a target's parent directory — "creating it here would be a
#      second, separate privileged act and so is not this script's business" —
#      so without a shipped file here, /etc/samba/smb.conf.d/ does not exist
#      and every share save is refused with "target directory does not exist".
#
#   2. It must not be the file Cassini owns. This package is reinstalled or
#      upgraded on every image update, and pacman replaces a file the package
#      ships. Had Cassini written its shares into THIS file, the first
#      `pacman -u shani-settings` would silently delete every share a user had
#      created through the GUI. Cassini therefore writes
#      50-shani-cassini.conf, which no package ships, so an update leaves it
#      alone.
#
# The include reads these files in lexical order, so 00- is read before 50-.
# Note that the include sits at the END of [global] in smb.conf: a [global]
# line placed in any drop-in here is overridden by the values further down in
# smb.conf. That is deliberate — it means a tool cannot quietly weaken
# `map to guest`, the guest-share policy or the minimum protocol by writing a
# global it believes is in force. To change a global, edit smb.conf itself.
#
# To create a share by hand instead of through the GUI, add a file here:
#
#   [myshare]
#      path = /srv/myshare
#      comment = Something
#      read only = no
#      guest ok = no
#      valid users = alice
#
# and then give the named user a Samba password, which is a separate thing from
# their Unix password and is not created for them:
#
#   sudo smbpasswd -a alice
#
# Nothing here grants a network peer anything on its own. A share is only
# reachable to the clients allowed by its own lines, and `guest ok = no` plus
# the global `map to guest = Never` in smb.conf is the default for anything a
# tool writes.