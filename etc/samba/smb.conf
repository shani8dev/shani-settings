[global]
   workgroup = WORKGROUP
   dns proxy = no
   log file = /var/log/samba/%m.log
   max log size = 1000
   client min protocol = SMB2
   server min protocol = SMB2
   server role = standalone server
   passdb backend = tdbsam
   obey pam restrictions = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   passwd chat = *New*UNIX*password* %n\n *ReType*new*UNIX*password* %n\n *passwd:*all*authentication*tokens*updated*successfully*
   pam password change = yes
   # Never (not "Bad Password"): a real username with a *wrong* password
   # must be a hard authentication failure, not silently mapped to guest
   # access — "Bad Password" masks failed/brute-forced logins as
   # successful guest sessions on any share that opts into guest access,
   # which contradicts this file's own guest-is-opt-in-only design below.
   # Explicit anonymous/guest connections to a `guest ok = yes` share still
   # work fine under "Never" — this only changes how a *failed* real-user
   # login is handled.
   map to guest = Never
   # Anonymous/guest access to user-created shares is opt-in, not a global
   # default — a desktop user ticking "Share" in Nautilus/Dolphin should not
   # silently expose that folder to unauthenticated network clients. Flip to
   # "yes" only for a deliberately public/guest usershare, and prefer scoping
   # that per-share rather than globally.
   usershare allow guests = no
   name resolve order = lmhosts bcast host wins
   security = user
   guest account = nobody
   usershare path = /var/lib/samba/usershare
   usershare max shares = 100
   usershare owner only = yes
   force create mode = 0070
   force directory mode = 0070

   # Share definitions written by a tool live in a drop-in, so a mistake in one
   # is removable by deleting a single file instead of editing this one — the
   # same reasoning the shani-cassini-save targets use for sudoers, sshd and
   # exports. The directory is shipped with a comment-only 00-shani-readme.conf,
   # because shani-cassini-save refuses to create a target's parent directory
   # and an image with no drop-in at all would refuse every share save with
   # "target directory does not exist". Shares Cassini creates go into
   # 50-shani-cassini.conf, which no package ships, so an image update cannot
   # overwrite them — see the comment in that directory's readme.
   #
   # **THE TWO INCLUDES ARE NAMED EXPLICITLY, AND A WILDCARD DOES NOT WORK.**
   # `include = /etc/samba/smb.conf.d/*.conf` is silently ignored: it parses
   # cleanly, warns about nothing, and includes NOTHING. Measured against
   # Samba 4.25.0 (the version Arch ships) with real `testparm`:
   #
   #     include = /etc/samba/smb.conf.d/*.conf    -> 0 sections
   #     include = /etc/samba/smb.conf.d/5*.conf   -> 0 sections
   #     include = /etc/samba/smb.conf.d/one.conf  -> the section appears
   #
   # So this is the one line in this file whose wrong form is invisible: no
   # error, no warning, and a share that silently never exists. Do not "tidy"
   # these two into one wildcard line — the cost of that "tidy" is a feature
   # that looks enabled and is not.
   #
   # A named include that does not exist is NOT an error (measured: rc=0,
   # "Loaded services file OK"), so the 50- line is harmless on a machine that
   # has never had a share created. That is what lets both files be named here
   # without the second one having to ship.
   #
   # PLACEMENT IS LOAD-BEARING and it is deliberate. This sits at the END of
   # [global], so a [global] line a tool put in a drop-in is OVERRIDDEN by the
   # settings below it. That is the safe direction: the drop-in is for share
   # definitions, and a tool cannot quietly weaken `map to guest`, the guest
   # policy, or the minimum protocol by writing a global it believes is in
   # force. To make a global change deliberately, edit it here, where it is
   # reviewed as part of this file.
   include = /etc/samba/smb.conf.d/00-shani-readme.conf
   include = /etc/samba/smb.conf.d/50-shani-cassini.conf

[homes]
   comment = Home Directories
   browseable = no
   read only = no
   create mask = 0700
   directory mask = 0700
   # Home dirs are owner-only (masks above) — override [global]'s
   # force create/directory mode (0070) so it doesn't force group-rwx
   # onto files here; that force mode is meant for shared usershares.
   force create mode = 0000
   force directory mode = 0000
   valid users = %S

[printers]
   comment = All Printers
   browseable = no
   path = /var/spool/samba
   printable = yes
   guest ok = no
   read only = yes
   create mask = 0700

[print$]
   comment = Printer Drivers
   path = /var/lib/samba/printers
   browseable = yes
   read only = yes
   guest ok = no
