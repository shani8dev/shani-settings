[global]
   workgroup = WORKGROUP
   dns proxy = no
   log file = /var/log/samba/%m.log
   max log size = 1000
   client min protocol = SMB2
   server min protocol = SMB2
   server role = standalone server
   passdb backend = tdbsam
   obey pam restrictions = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   passwd chat = *New*UNIX*password* %n\n *ReType*new*UNIX*password* %n\n *passwd:*all*authentication*tokens*updated*successfully*
   pam password change = yes
   # Never (not "Bad Password"): a real username with a *wrong* password
   # must be a hard authentication failure, not silently mapped to guest
   # access — "Bad Password" masks failed/brute-forced logins as
   # successful guest sessions on any share that opts into guest access,
   # which contradicts this file's own guest-is-opt-in-only design below.
   # Explicit anonymous/guest connections to a `guest ok = yes` share still
   # work fine under "Never" — this only changes how a *failed* real-user
   # login is handled.
   map to guest = Never
   # Anonymous/guest access to user-created shares is opt-in, not a global
   # default — a desktop user ticking "Share" in Nautilus/Dolphin should not
   # silently expose that folder to unauthenticated network clients. Flip to
   # "yes" only for a deliberately public/guest usershare, and prefer scoping
   # that per-share rather than globally.
   usershare allow guests = no
   name resolve order = lmhosts bcast host wins
   security = user
   guest account = nobody
   usershare path = /var/lib/samba/usershare
   usershare max shares = 100
   usershare owner only = yes
   force create mode = 0070
   force directory mode = 0070

[homes]
   comment = Home Directories
   browseable = no
   read only = no
   create mask = 0700
   directory mask = 0700
   # Home dirs are owner-only (masks above) — override [global]'s
   # force create/directory mode (0070) so it doesn't force group-rwx
   # onto files here; that force mode is meant for shared usershares.
   force create mode = 0000
   force directory mode = 0000
   valid users = %S

[printers]
   comment = All Printers
   browseable = no
   path = /var/spool/samba
   printable = yes
   guest ok = no
   read only = yes
   create mask = 0700

[print$]
   comment = Printer Drivers
   path = /var/lib/samba/printers
   browseable = yes
   read only = yes
   guest ok = no
