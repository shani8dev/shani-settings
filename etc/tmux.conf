# /etc/tmux.conf - ShaniOS defaults. Loaded before ~/.config/tmux/tmux.conf
# (or ~/.tmux.conf), so anything here can be overridden per user.
# Prefix stays tmux's Ctrl-b.

## Terminal: true colour, undercurl, focus and clipboard via OSC 52
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB,konsole*:RGB,alacritty*:RGB,foot*:RGB,*:usstyle"
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string "#S: #W — #{pane_current_path}"

## Behaviour
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g repeat-time 400
set -g display-time 2000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g detach-on-destroy off        # closing a session jumps to another
setw -g aggressive-resize on
setw -g mode-keys vi
set -g status-keys emacs

## Keys (in addition to the defaults)
# splits and new windows open in the current directory; | and - are mnemonic
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"
# vim-style pane moves and resizes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# Alt-arrows / Alt-1..9 without the prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
# copy mode: v selects, y copies (OSC 52 reaches the desktop clipboard)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind r source-file /etc/tmux.conf \; source-file -q ~/.tmux.conf \; source-file -q ~/.config/tmux/tmux.conf \; display "config reloaded"
bind S setw synchronize-panes \; display "synchronize-panes #{?synchronize-panes,on,off}"

## Look: Saturn Dark, exact values from the shipped SaturnDark.colors
## (Window #252434, View #2d2c3b, alternate #353443, accent #ff7f50,
## text #dedee1, inactive #9999a0, positive #7dd6aa, neutral #ffc69b)
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#2d2c3b,fg=#dedee1"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#ff7f50,fg=#252434,bold] #S #[bg=#2d2c3b] "
set -g status-right "#{?client_prefix,#[fg=#252434 bg=#ffc69b bold] PREFIX #[default] ,}#{?pane_in_mode,#[fg=#252434 bg=#7dd6aa bold] COPY #[default] ,}#[fg=#9999a0]#{=/-30/…:pane_current_path} #[fg=#dedee1,bg=#353443] %H:%M #[bg=#ff7f50,fg=#252434,bold] #h "
setw -g window-status-format "#[fg=#9999a0] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[bg=#353443,fg=#ffc5af,bold] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#ffc69b"
setw -g monitor-activity on
set -g visual-activity off
set -g pane-border-style "fg=#454456"
set -g pane-active-border-style "fg=#ff7f50"
set -g pane-border-lines single
set -g display-panes-active-colour "#ff7f50"
set -g display-panes-colour "#9999a0"
set -g message-style "bg=#353443,fg=#dedee1"
set -g message-command-style "bg=#353443,fg=#ffc69b"
setw -g mode-style "bg=#ff7f50,fg=#252434"
setw -g clock-mode-colour "#ff7f50"
