# ShaniOS SSH server defaults — a drop-in, not a fork of sshd_config.
#
# Openssh reads sshd_config.d/*.conf in lexical order and uses the FIRST value
# obtained for each keyword, so a "00-" prefix is what makes these win over
# Arch's own 99-archlinux.conf (verified with sshd -T, not assumed: with this
# file present the effective config resolves PermitRootLogin no, X11Forwarding
# no and TCPKeepAlive no while Arch's KbdInteractiveAuthentication no survives).
#
# SCOPE — why this file exists at all:
#   sshd is NOT enabled on any ShaniOS desktop profile (shani-network installs
#   openssh but its .install never runs `systemctl enable sshd.service`; only
#   the `server` profile enables it, and `server` does not depend on
#   shani-settings at all). So this ships inert by default and takes effect the
#   moment a user enables sshd themselves — at which point, without this file,
#   they would silently get stock Arch settings.
#   The server profile has its own, deliberately different, drop-in at
#   shani-install-media/image_profiles/server/overlay/rootfs/etc/ssh/
#   sshd_config.d/10-server-hardening.conf (key-only auth, because cloud-init
#   injects the EC2 key pair). That is a profile needing different content, so
#   per this repo's "four candidate homes" rule it stays there and does not
#   affect this file.
#
# Tuned to remain usable for the actual reason a desktop user enables sshd:
# administering their own machine.

# ── Authentication ───────────────────────────────────────────────────────────
# Root login is off entirely. This is a default no local user needs and the
# one credential whose compromise is total; "prohibit-password" (the Arch
# default) still permits a root key, which buys nothing here.
PermitRootLogin no

# PasswordAuthentication is deliberately NOT set. Arch's default is `yes`, and
# this repo's etc/fail2ban/jail.local has an enabled [sshd] jail with
# maxretry=3/bantime=24h, which only makes sense if password auth is expected
# to exist. Pinning it to `no` here would break the common case (a user
# password-logging into their own desktop from a phone or a second machine) and
# would contradict that jail. Brute force is answered by fail2ban, not by making
# the feature unusable.
# To require keys instead, set these in your own drop-in — a later-sorting
# file cannot override this one, but /etc/ssh/sshd_config itself is read LAST
# for anything not already set, so editing it does win:
#     PasswordAuthentication no
#     KbdInteractiveAuthentication no

# Three attempts, not the default six. Combined with fail2ban's 24h ban this
# keeps a single guess loop cheap for the attacker and slow for the user.
MaxAuthTries 3

# ── Session exposure ─────────────────────────────────────────────────────────
# Nobody SSHes into a desktop to forward X11.
X11Forwarding no

# Agent forwarding hands the remote side a socket that can sign as the local
# user, so a compromised host you SSH into can authenticate as you elsewhere.
# There is no desktop use case for it.
AllowAgentForwarding no

# Port forwarding IS a normal desktop action — tunnelling to a dev server or a
# database — so this is NOT disabled. What is tightened is where the forwarded
# port may listen: `local` binds it to loopback only, so `ssh -L` cannot
# publish a service on every interface of the machine, which is the form that
# actually gets used to expose something by accident.
# (maze-hardening sets `AllowTcpForwarding no` outright; that would break the
# use case rather than constrain it, which is the wrong trade for a default.)
AllowTcpForwarding local
GatewayPorts no

# Two concurrent sessions per connection: enough for the multiplexing tools
# that open a control socket plus the session itself.
MaxSessions 2

# ── Housekeeping ─────────────────────────────────────────────────────────────
# Idle sessions get reaped instead of lingering forever.
ClientAliveInterval 300
ClientAliveCountMax 2

# VERBOSE logs the key exchange and authentication steps rather than just
# successes. This is what makes a fail2ban ban auditable after the fact — with
# the default INFO level a failed attempt is logged but the details of *why* it
# failed are not.
LogLevel VERBOSE

# Application-level keepalives instead of TCP-level ones: sshd checks on its own
# schedule, so a dead peer is noticed in ~10 minutes rather than after the
# kernel's ~2h11m TCP timeout.
TCPKeepAlive no
