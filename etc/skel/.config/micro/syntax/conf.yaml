filetype: conf

detect:
    # *.conf/*.cfg, plus common extension-less /etc files (these used to be
    # forced via a "/etc/*" glob in settings.json, which also overrode real
    # syntaxes such as /etc/*.sh, *.json, *.toml)
    filename: "(\\.(conf|cfg)$|/etc/(fstab|crypttab|hosts|hostname|environment|locale\\.gen|vconsole\\.conf|shells|subuid|subgid|issue|motd)$)"

rules:
    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\."

    - comment:
        start: "#"
        end: "$"
        rules:
            - todo: "(TODO|XXX|FIXME):?"
