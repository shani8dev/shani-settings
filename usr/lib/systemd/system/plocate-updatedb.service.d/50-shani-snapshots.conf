# Leave snapshot folders out of the locate index (the launcher's file search,
# Chronoa's find_files): shani-backup keeps daily snapshots of the homes in
# /home/.snapshots (snapper uses the same name), and each one would list every
# file in every home again. /etc/updatedb.conf is plocate's own file, so the
# name is added here, as a flag; the rest of that file still applies.
# A plain `sudo updatedb` reads only /etc/updatedb.conf.
[Service]
ExecStart=
ExecStart=/usr/bin/updatedb --add-prunenames .snapshots
