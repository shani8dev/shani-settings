# Hardware watchdog: a hard freeze resets the machine instead of hanging
# forever, and a shutdown that hangs is forced after 2 minutes. On a machine
# without a watchdog device (/dev/watchdog0) systemd ignores both.
# Together with panic=10 on the kernel command line this is what turns a
# freeze or a panic of a freshly deployed slot into a reboot, so the boot
# failure markers (shani-deploy) can do their job.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
