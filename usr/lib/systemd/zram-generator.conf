[zram0]
zram-size = ram
compression-algorithm = zstd

# Prefer zram over any other swap device.
#
# Without this the generator picks a default, and whether compressed-RAM swap
# actually gets used ahead of a disk-backed swap partition or file depends on
# that default rather than on this file's stated intent. `swap-priority = 100`
# is the conventional "highest" value and matches what maze-hardening ships.
#
# This pairs with vm.swappiness = 133 in usr/lib/sysctl.d/99-sysctl-shani.conf:
# high swappiness makes the kernel reach for swap readily, and priority is what
# makes "swap" mean zram rather than the disk. Either alone is only half the
# intent — swappiness with zram deprioritised would push pages to disk (the
# exact stall the zram device exists to avoid).
swap-priority = 100
